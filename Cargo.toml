[package]
name = "tiny-dictate"
version = "0.1.0"
edition = "2024"
description = "Minimal voice dictation for Linux"
license = "MIT"
repository = "https://github.com/cbenz/tiny-dictate"
readme = "README.md"
publish = false

[dependencies]
# The pill links GTK and gtk4-layer-shell directly; only the `_present` mode calls `gtk::init()`, so
# the interactive commands still exec in a few milliseconds.
gtk4 = { version = "0.11.5", features = ["v4_22"] }
gtk4-layer-shell = { version = "0.8.1", features = ["v1_3"] }
crossterm = "0.29.0"
unicode-width = "0.2.0"
libc = "0.2.190"
